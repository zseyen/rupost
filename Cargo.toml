[package]
name = "rupost"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A API test tool based on documents"
authors = ["RuPost Contributors"]
license = "MIT"
repository = "https://github.com/zseyen/rupost"
homepage = "https://github.com/zseyen/rupost"
keywords = ["api", "testing", "http", "websocket", "cli"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
default-run = "rupost"


[workspace]
members = [
    "crates/rupost-ai"
]

[workspace.dependencies]
# `default-tls` 是 load-bearing：关闭后 HTTPS/WSS 静默失效（请求 0ms 报
# "error sending request"），且全量测试（本地 http wiremock）无法捕获——
# 仅 examples/run_all.sh 的外网用例可暴露。删除前必须三思。
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "default-tls"] }
rupost-ai = { path = "crates/rupost-ai" }
tokio = { version = "1.49.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
async-trait = "0.1.89"

[lib]
name = "rupost"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.1.1"
comfy-table = "7.2.2"
dirs = "6.0.0"
hmac = "0.12"
inquire = "0.9.2"
once_cell = "1.21.3"
pulldown-cmark = "0.13.0"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { workspace = true }
rupost-ai = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
rmp-serde = "1.3.0"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = "0.9.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }
semver = "1.0"
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"
unicode-width = "0.1.13"

# M1：JUnit XML 报告（纯 Rust 序列化，工业级转义）+ 终端 ANSI 控制符剥离（防 XML 解析器 SAX 异常）
quick-xml = { version = "0.42", features = ["serialize"] }
strip-ansi-escapes = "0.2"

# unix 侧 --on-failure 钩子进程组终结（killpg）；已是 tokio/nix 传递依赖，零新增编译面。
# 注意：target 表必须置于 [dependencies] 全部键之后——TOML 表头会吞掉其后所有键
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cookie = "0.18"
socket2 = "0.6"
dirs = "6.0.0"
tempfile = "3.24.0"
wiremock = "0.6.5"
criterion = { version = "0.5", features = ["html_reports"] }
filetime = "0.2.29"
ctor = "0.4"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "trie_matcher_bench"
harness = false

[[bench]]
name = "variable_resolver_bench"
harness = false

[[example]]
name = "load_generator"
path = "benches/load_test/load_generator.rs"


[[bench]]
name = "registry_cache_bench"
harness = false

# 仅对第三方依赖关闭调试符号，显著降低本地与 CI 的编译耗时、链接内存与 target 体积；
# 本仓 crate 仍保留完整调试信息，不影响本地排障与 CI 符号产物。
[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0
