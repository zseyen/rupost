name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支或 PR 连续推送时，自动中止上一次未跑完的任务，节省计算资源与排队时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 环境关闭增量图谱生成，减少磁盘 I/O 阻塞并显著提升编译速度
  CARGO_INCREMENTAL: 0

jobs:
  # Job 1: 格式检查
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: 静态代码规范检查 (Clippy)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard rupost_ai crate boundary (P1-9/B0)
        run: |
          if grep -rnE '\brupost_ai\b' src/ --exclude-dir=ai; then
            echo "::error::P1-9/B0 boundary violation: rupost_ai may only be referenced inside src/ai/"
            exit 1
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Job 3: 多平台编译、全量测试与调试版本工件直出 (Linux / macOS / Windows)
  test:
    name: Test & Debug Artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_path: target/debug/rupost
          - os: macos-latest
            bin_path: target/debug/rupost
          - os: windows-latest
            bin_path: target/debug/rupost.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Debug Binary (Full Symbols)
        run: cargo build --workspace --bins
      - name: Run Tests
        run: cargo test --workspace
      - name: Upload Debug Binary Artifact
        # 即使某个测试出现失败，只要构建产物生成即执行上传，便于开发者拉取二进制进行本地复现排障
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rupost-debug-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.bin_path }}
          retention-days: 7
          if-no-files-found: ignore

  # Job 4: WP-2 可信度——Web 前端无依赖原生单测（本地 make test-web 的 CI 事实化，
  # 独立 Ubuntu job：node --test 零 npm 依赖，不进三平台 matrix）
  web-assets:
    name: Web Frontend Tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run web frontend tests
        run: node --test tests/web/app_test.mjs

  # Job 5: C-1 容器叙事守护——musl 静态链接 + 体积预算断言（scratch/Alpine 可用的工程事实化）
  musl-static:
    name: musl Static Build & Size Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: musl
      - name: Install musl toolchain (gcc + cmake for aws-lc-rs)
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Build Static Release Binary
        run: cargo build --release --target x86_64-unknown-linux-musl --bin rupost
      - name: Verify Static Linking (no dynamic deps)
        run: |
          file target/x86_64-unknown-linux-musl/release/rupost | grep -q "statically linked" || {
            echo "::error::binary is not statically linked"; exit 1
          }
      - name: Size Budget Assertion (≤20MB, 01 §1 DoD)
        run: |
          SIZE=$(stat -c%s target/x86_64-unknown-linux-musl/release/rupost)
          echo "release binary: $SIZE bytes"
          if [ "$SIZE" -gt 20971520 ]; then
            echo "::error::size budget exceeded: $SIZE > 20971520 (20MB)"
            exit 1
          fi
