name: CI

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支或 PR 连续推送时，自动中止上一次未跑完的任务，节省计算资源与排队时间
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 环境关闭增量图谱生成，减少磁盘 I/O 阻塞并显著提升编译速度
  CARGO_INCREMENTAL: 0

jobs:
  # Job 1: 格式检查
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: 静态代码规范检查 (Clippy)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Job 3: 多平台编译、全量测试与调试版本工件直出 (Linux / macOS / Windows)
  test:
    name: Test & Debug Artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_path: target/debug/rupost
          - os: macos-latest
            bin_path: target/debug/rupost
          - os: windows-latest
            bin_path: target/debug/rupost.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Debug Binary (Full Symbols)
        run: cargo build --workspace --bins
      - name: Run Tests
        run: cargo test --workspace
      - name: Upload Debug Binary Artifact
        # 即使某个测试出现失败，只要构建产物生成即执行上传，便于开发者拉取二进制进行本地复现排障
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rupost-debug-${{ matrix.os }}-${{ github.sha }}
          path: ${{ matrix.bin_path }}
          retention-days: 7
          if-no-files-found: ignore
