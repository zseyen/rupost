[package]
name = "rupost"
version = "0.2.0"
edition = "2024"
description = "A API test tool based on documents"

[workspace]
members = [
    "crates/rupost-ai"
]

[lib]
name = "rupost"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.1.1"
comfy-table = "7.2.2"
dirs = "6.0.0"
fs2 = "0.4.3"
inquire = "0.9.2"
once_cell = "1.21.3"
pulldown-cmark = "0.13.0"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-native-roots"] }
rmp-serde = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4"] }
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.16"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"

[dev-dependencies]
cookie = "0.18"
dirs = "6.0.0"
tempfile = "3.24.0"
wiremock = "0.6.5"
criterion = { version = "0.5", features = ["html_reports"] }
filetime = "0.2.29"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "trie_matcher_bench"
harness = false

[[bench]]
name = "variable_resolver_bench"
harness = false

[[bin]]
name = "load_generator"
path = "benches/load_test/load_generator.rs"

