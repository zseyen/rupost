name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Job 1: Check formatting
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Job 2: Check linting (Clippy)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        # --workspace：默认跑法漏掉 workspace 子 crate（rupost-ai 等）的 lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Job 3: Build and Test on multiple platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # --workspace：预热全部 crate 的编译缓存，test 步骤零冷编译
        run: cargo build --workspace --verbose
      - name: Run tests
        # --workspace：默认跑法漏掉 workspace 子 crate 的测试（测试策略 v3 §7.1）
        run: cargo test --workspace --verbose

  # Job 4: Debug build artifacts for local functional testing (after merge)
  debug-artifacts:
    name: Debug artifacts (aarch64-apple-darwin)
    runs-on: macos-latest
    needs: [fmt]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (debug, line-tables-only)
        env:
          # 仅 CI 构建瘦身（体积降约七成，backtrace 仍可用）；本地 Cargo.toml 不受影响
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo build --workspace
      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupost-debug-aarch64-apple-darwin-${{ github.sha }}
          path: target/debug/rupost
          retention-days: 30
          if-no-files-found: error
